{% extends "base.html" %}
{% block title %} - Démo{% endblock %}
{% block content %}
<h2 class="h4 mb-3">Modes de démonstration</h2>
<div class="card shadow-sm">
  <div class="card-body">
    <table class="table mb-0">
      <thead><tr><th>Flag</th><th>Actif</th></tr></thead>
      <tbody>
        {% for name, enabled in flags.items() %}
          <tr><td>{{ name }}</td><td>{{ 'Oui' if enabled else 'Non' }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    <div class="mt-3 d-flex gap-2 flex-wrap">
      <a class="btn btn-outline-primary" href="{{ url_for('demo.upload') }}">Upload</a>
      <a class="btn btn-outline-danger" href="{{ url_for('demo.error') }}">Erreur démo</a>
    </div>
  </div>
</div>
{% endblock %}
